[project]
name = "segundo-cerebro-rag"
version = "0.1.0"
description = "RAG local sobre o vault PARA: ingestão por tipo, recuperação híbrida e resposta com citação."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Rafael Pulzi" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.12",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
modelos = ["sentence-transformers>=3.3"]
pdf = ["pymupdf>=1.25"]
youtube = ["youtube-transcript-api>=1.0"]
web = ["trafilatura>=2.0"]

[project.scripts]
cerebro = "cerebro.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "respx>=0.21", "ruff>=0.7", "mypy>=1.13", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerebro"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
# › separa a trilha de headings; os demais formam o prefixo de status das notas do vault.
allowed-confusables = ["›", "×", "（", "）", "；", "´", "｀"]

[tool.ruff.lint.isort]
known-first-party = ["cerebro", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["frontmatter.*", "rank_bm25.*", "sentence_transformers.*", "fitz.*", "youtube_transcript_api.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: precisa de Qdrant ou Ollama de pé"]
